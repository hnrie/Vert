name: Build Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    if: ${{ vars.VERT_APP_URL != '' }}
    runs-on: windows-latest
    env:
      VERT_APP_URL: ${{ vars.VERT_APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Vert-Windows-App
          path: src-tauri/target/release/bundle/nsis/*.exe

  build-android:
    if: ${{ vars.VERT_APP_URL != '' }}
    runs-on: ubuntu-latest
    env:
      VERT_APP_URL: ${{ vars.VERT_APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - run: npm ci
      - run: npx cap add android
      - run: npm run native:android
      - run: ./gradlew assembleDebug
        working-directory: android
      - run: |
          version=$(node -p "require('./package.json').version")
          mv android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/vert-v${version}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Vert-Android-App
          path: android/app/build/outputs/apk/debug/vert-*.apk
